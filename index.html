<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unclothy Undress Tool</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 { margin-bottom: 8px; font-size: 1.8rem; }
    .subtitle { color: #aaa; margin-bottom: 24px; font-size: 0.95rem; }
    .card {
      background: #1a1a1a;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .api-key-section { margin-bottom: 20px; }
    label { display: block; margin-bottom: 6px; font-size: 0.9rem; color: #ccc; }
    input[type="text"], select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #111;
      color: #fff;
      font-size: 1rem;
    }
    .upload-area {
      border: 2px dashed #444;
      border-radius: 12px;
      padding: 32px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
      margin: 16px 0;
    }
    .upload-area:hover, .upload-area.dragover { border-color: #e91e63; }
    .upload-area img { max-width: 100%; max-height: 220px; border-radius: 8px; margin-top: 12px; }
    #fileInput { display: none; }
    .settings {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 16px 0;
    }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #e91e63;
      color: white;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
      transition: background 0.2s;
    }
    button:hover { background: #c2185b; }
    button:disabled { background: #555; cursor: not-allowed; }
    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background: #222;
      font-size: 0.9rem;
      display: none;
    }
    .status.show { display: block; }
    .status.error { background: #3a1515; color: #ff8a80; }
    .status.success { background: #153a15; color: #a5d6a7; }
    .result {
      margin-top: 20px;
      display: none;
    }
    .result.show { display: block; }
    .result img { width: 100%; border-radius: 12px; }
    .credits { text-align: center; margin-top: 12px; color: #888; font-size: 0.85rem; }
    .note { font-size: 0.8rem; color: #777; margin-top: 16px; text-align: center; }
  </style>
</head>
<body>
  <h1>Unclothy Undress</h1>
  <p class="subtitle">Upload ảnh → tạo ảnh khỏa thân</p>

  <div class="card">
    <div class="api-key-section">
      <label>API Key</label>
      <input type="text" id="apiKey" placeholder="8feea150-ba6c-..." value="8feea150-ba6c-45b9-b27a-5972befd5e41">
    </div>

    <div class="upload-area" id="uploadArea">
      <p>Kéo thả ảnh vào đây hoặc click để chọn</p>
      <img id="preview" style="display:none">
    </div>
    <input type="file" id="fileInput" accept="image/*">

    <div class="settings">
      <div>
        <label>Mode</label>
        <select id="generationMode">
          <option value="naked">Naked (khỏa thân)</option>
          <option value="bikini">Bikini</option>
        </select>
      </div>
      <div>
        <label>Gender</label>
        <select id="gender">
          <option value="female">Female</option>
          <option value="male">Male</option>
        </select>
      </div>
      <div>
        <label>Body Type</label>
        <select id="bodyType">
          <option value="automatic">Automatic</option>
          <option value="skinny">Skinny</option>
          <option value="athletic">Athletic</option>
          <option value="curvy">Curvy</option>
        </select>
      </div>
      <div>
        <label>Breasts Size</label>
        <select id="breastsSize">
          <option value="automatic">Automatic</option>
          <option value="small">Small</option>
          <option value="medium">Medium</option>
          <option value="large">Large</option>
        </select>
      </div>
    </div>

    <button id="createBtn" disabled>Tạo ảnh khỏa thân</button>

    <div class="status" id="status"></div>
    <div class="credits" id="creditsInfo"></div>

    <div class="result" id="result">
      <img id="resultImg" alt="Result">
      <button id="downloadBtn" style="margin-top:12px;background:#333">Tải ảnh về</button>
    </div>
  </div>

  <p class="note">Sử dụng API Unclothy • Credits sẽ bị trừ khi tạo thành công</p>

  <script>
    const API_BASE = 'https://unclothy.com/api';
    let selectedFile = null;
    let base64Data = null;

    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const createBtn = document.getElementById('createBtn');
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');
    const resultImg = document.getElementById('resultImg');
    const creditsInfo = document.getElementById('creditsInfo');

    uploadArea.addEventListener('click', () => fileInput.click());
    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });
    uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) handleFile(fileInput.files[0]);
    });

    function handleFile(file) {
      if (!file.type.startsWith('image/')) {
        showStatus('Chỉ chấp nhận file ảnh', true);
        return;
      }
      selectedFile = file;
      const reader = new FileReader();
      reader.onload = (e) => {
        base64Data = e.target.result;
        preview.src = base64Data;
        preview.style.display = 'block';
        createBtn.disabled = false;
        resultEl.classList.remove('show');
      };
      reader.readAsDataURL(file);
    }

    function showStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.className = 'status show ' + (isError ? 'error' : '');
    }

    async function getCredits() {
      const key = document.getElementById('apiKey').value.trim();
      if (!key) return;
      try {
        const res = await fetch(`${API_BASE}/v2/user/credits`, {
          headers: { 'x-api-key': key, 'Accept': 'application/json' }
        });
        const data = await res.json();
        if (data.success) {
          creditsInfo.textContent = `Credits còn lại: ${data.result.credits}`;
        }
      } catch (e) {}
    }

    getCredits();

    createBtn.addEventListener('click', async () => {
      const key = document.getElementById('apiKey').value.trim();
      if (!key) {
        showStatus('Vui lòng nhập API Key', true);
        return;
      }
      if (!base64Data) {
        showStatus('Vui lòng chọn ảnh', true);
        return;
      }

      createBtn.disabled = true;
      showStatus('Đang tạo task...');

      const settings = {
        generationMode: document.getElementById('generationMode').value,
        gender: document.getElementById('gender').value,
        age: 'automatic',
        bodyType: document.getElementById('bodyType').value,
        breastsSize: document.getElementById('breastsSize').value,
        assSize: 'automatic',
        pussy: 'shaved',
        penis: 'shaved'
      };

      try {
        const createRes = await fetch(`${API_BASE}/v2/task/create`, {
          method: 'POST',
          headers: {
            'x-api-key': key,
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({
            base64: base64Data,
            settings: settings
          })
        });

        const createData = await createRes.json();
        if (!createData.success) {
          throw new Error(createData.message || 'Tạo task thất bại');
        }

        const taskId = createData.result.task_id;
        showStatus(`Task đã tạo (${taskId}). Đang chờ kết quả...`);

        let attempts = 0;
        const maxAttempts = 60;
        const poll = async () => {
          attempts++;
          const statusRes = await fetch(`${API_BASE}/v2/task/${taskId}`, {
            headers: { 'x-api-key': key, 'Accept': 'application/json' }
          });
          const statusData = await statusRes.json();

          if (!statusData.success) {
            throw new Error(statusData.message || 'Lỗi khi lấy trạng thái');
          }

          const status = statusData.result.status;
          if (status === 'Completed' || status === 'completed' || statusData.result.image) {
            const imageUrl = statusData.result.image || statusData.result.result_url || statusData.result.output;
            if (imageUrl) {
              resultImg.src = imageUrl.startsWith('data:') || imageUrl.startsWith('http') ? imageUrl : `data:image/jpeg;base64,${imageUrl}`;
              resultEl.classList.add('show');
              showStatus('Hoàn thành!', false);
              statusEl.classList.add('success');
              getCredits();
            } else {
              showStatus('Task hoàn thành nhưng không có ảnh trả về', true);
            }
            createBtn.disabled = false;
            return;
          }

          if (status === 'Failed' || status === 'failed') {
            throw new Error('Task thất bại');
          }

          showStatus(`Đang xử lý... (${attempts}/${maxAttempts}) - Status: ${status}`);
          if (attempts < maxAttempts) {
            setTimeout(poll, 2000);
          } else {
            throw new Error('Timeout - task quá lâu');
          }
        };

        setTimeout(poll, 2000);

      } catch (err) {
        showStatus('Lỗi: ' + err.message, true);
        createBtn.disabled = false;
      }
    });

    document.getElementById('downloadBtn').addEventListener('click', () => {
      const a = document.createElement('a');
      a.href = resultImg.src;
      a.download = 'unclothy-result.jpg';
      a.click();
    });
  </script>
</body>
          </html>
